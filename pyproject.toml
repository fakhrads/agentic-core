[project]
name = "agent-core"
version = "0.1.0"
description = "Autonomous agent core — consumer of auth/tools contract v1"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.23",
    "aiosqlite>=0.20",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-redis",
]

[project.scripts]
agent = "agent.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "T20"]
# T20 = flake8-print: no print() outside cli/
[tool.ruff.lint.per-file-ignores]
"src/agent/cli/*" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["agent"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "pgvector.*"]
ignore_missing_imports = true
