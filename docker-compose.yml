# Dev-local dependencies only. The agent daemon itself runs on the host via
# `agent up` during development; in prod it ships as its own image (Dockerfile).
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Host port 6380, not 6379 — avoids colliding with a native/Homebrew
      # Redis already running on the default port (common on dev machines,
      # and some builds hang on blocking XREADGROUP, wedging the event loop).
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      # Host port 5433, not 5432 — avoids colliding with a native/Homebrew
      # Postgres already running on the default port (common on dev machines).
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  pg-data:
